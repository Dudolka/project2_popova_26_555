
[project]
name = "primitive-db"
version = "0.1.0"
description = "Консольная база данных с JSON-хранением, CRUD-операциями, декораторами и кэшированием"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Olga Popova" }
]
dependencies = [
    "prettytable>=3.18.0,<4.0.0",
    "prompt>=0.4.1,<0.5.0",
]

[project.scripts]
database = "primitive_db.main:main"
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3,<0.18.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.uv.workspace]
members = []
